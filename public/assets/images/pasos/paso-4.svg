<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#0B2B29"/>
  <!-- Dorso de dedos trabados en gancho -->
  <g fill="#00B39F" opacity="0.9">
    <path d="M160,130 C160,105 200,105 200,130 L200,170 C200,195 160,195 160,170 Z" fill="#00B39F"/>
    <path d="M190,140 C190,115 230,115 230,140 L230,180 C230,205 190,205 190,180 Z" fill="#CFFBF0" opacity="0.8"/>
  </g>
  <!-- Flecha lateral de encastre -->
  <line x1="140" y1="155" x2="250" y2="155" stroke="#FF6A4D" stroke-width="6" stroke-linecap="round"/>
  <polygon points="130,155 145,147 145,163" fill="#FF6A4D"/>
  <polygon points="260,155 245,147 245,163" fill="#FF6A4D"/>
  <text x="200" y="275" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#CFFBF0" text-anchor="middle">Dorso de Dedos contra Palma Opuesta</text>
</svg>
