<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#0B2B29"/>
  <!-- Palmas unidas con dedos entrelazados -->
  <g fill="#00B39F" opacity="0.9">
    <rect x="160" y="100" width="12" height="70" rx="6" fill="#00B39F"/>
    <rect x="178" y="90" width="12" height="85" rx="6" fill="#CFFBF0"/>
    <rect x="196" y="95" width="12" height="80" rx="6" fill="#00B39F"/>
    <rect x="214" y="85" width="12" height="90" rx="6" fill="#CFFBF0"/>
    <rect x="232" y="105" width="12" height="65" rx="6" fill="#00B39F"/>
    <path d="M150,170 C150,220 250,220 250,170 Z" fill="#00B39F"/>
  </g>
  <!-- Flechas interdigitales horizontales -->
  <line x1="130" y1="140" x2="270" y2="140" stroke="#FF6A4D" stroke-width="6" stroke-linecap="round"/>
  <polygon points="120,140 135,132 135,148" fill="#FF6A4D"/>
  <polygon points="280,140 265,132 265,148" fill="#FF6A4D"/>
  <text x="200" y="275" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#CFFBF0" text-anchor="middle">Palma con Palma y Espacios Interdigitales</text>
</svg>
