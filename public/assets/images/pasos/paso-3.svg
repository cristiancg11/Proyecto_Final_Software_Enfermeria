<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8FCF7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF4EE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="handLeftPalmar" x1="60" y1="50" x2="160" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="handRightPalmar" x1="160" y1="50" x2="260" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2B29" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="280" rx="24" fill="url(#bgGrad3)"/>

  <!-- Puntos focales de fricción interdigital en los pliegues -->
  <g class="interdigital-focus" opacity="0.6">
    <circle cx="120" cy="95" r="7" fill="#CFFBF0" stroke="#00B39F" stroke-width="1.5"/>
    <circle cx="140" cy="85" r="7" fill="#FFE9DE" stroke="#FF6A4D" stroke-width="1.5"/>
    <circle cx="160" cy="80" r="7" fill="#CFFBF0" stroke="#00B39F" stroke-width="1.5"/>
    <circle cx="180" cy="85" r="7" fill="#FFE9DE" stroke="#FF6A4D" stroke-width="1.5"/>
    <circle cx="200" cy="95" r="7" fill="#CFFBF0" stroke="#00B39F" stroke-width="1.5"/>
  </g>

  <!-- Manos Entrelazadas Frente a Frente (Entrelazado en Peine) -->
  <g class="hands-interlocked" filter="url(#shadow3)">
    
    <!-- Base palmar izquierda -->
    <path d="M75 230 C80 190, 85 155, 95 130 C105 105, 115 100, 115 115 L115 160 C110 185, 100 210, 95 230 Z" 
          fill="url(#handLeftPalmar)" stroke="#0B2B29" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Base palmar derecha -->
    <path d="M245 230 C240 190, 235 155, 225 130 C215 105, 205 100, 205 115 L205 160 C210 185, 220 210, 225 230 Z" 
          fill="url(#handRightPalmar)" stroke="#008072" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Peine de Dedos Entrelazados Alternos -->
    <!-- Dedo 1 (Izq - Meñique) -->
    <path d="M106 135 L106 70 C106 58, 118 58, 118 70 L118 135" fill="url(#handLeftPalmar)" stroke="#0B2B29" stroke-width="3" stroke-linecap="round"/>
    <!-- Dedo 2 (Der - Anular) -->
    <path d="M124 135 L124 55 C124 43, 136 43, 136 55 L136 135" fill="url(#handRightPalmar)" stroke="#008072" stroke-width="3" stroke-linecap="round"/>
    <!-- Dedo 3 (Izq - Medio) -->
    <path d="M142 135 L142 42 C142 30, 154 30, 154 42 L154 135" fill="url(#handLeftPalmar)" stroke="#0B2B29" stroke-width="3" stroke-linecap="round"/>
    <!-- Dedo 4 (Der - Medio) -->
    <path d="M160 135 L160 40 C160 28, 172 28, 172 40 L172 135" fill="url(#handRightPalmar)" stroke="#008072" stroke-width="3" stroke-linecap="round"/>
    <!-- Dedo 5 (Izq - Índice) -->
    <path d="M178 135 L178 52 C178 40, 190 40, 190 52 L190 135" fill="url(#handLeftPalmar)" stroke="#0B2B29" stroke-width="3" stroke-linecap="round"/>
    <!-- Dedo 6 (Der - Índice) -->
    <path d="M196 135 L196 68 C196 56, 208 56, 208 68 L208 135" fill="url(#handRightPalmar)" stroke="#008072" stroke-width="3" stroke-linecap="round"/>

    <!-- Pulgares cruzados en base de fricción -->
    <path d="M90 160 C80 152, 72 158, 68 168 C64 180, 78 190, 92 188" stroke="#0B2B29" stroke-width="3" fill="#FDBA74" stroke-linecap="round"/>
    <path d="M230 160 C240 152, 248 158, 252 168 C256 180, 242 190, 228 188" stroke="#008072" stroke-width="3" fill="#FBBF24" stroke-linecap="round"/>

    <!-- Unión y centro palmar activo -->
    <path d="M110 145 C135 155, 185 155, 210 145 C205 185, 115 185, 110 145 Z" fill="#FDBA74" fill-opacity="0.4" stroke="#00B39F" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Flechas Opuestas de Fricción Interdigital -->
  <g class="interdigital-arrows">
    <!-- Flecha hacia abajo en hendidura izquierda -->
    <path d="M130 35 L130 18" stroke="#FF6A4D" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="130,10 125,22 135,22" fill="#FF6A4D"/>
    
    <!-- Flecha hacia arriba en hendidura derecha -->
    <path d="M184 18 L184 35" stroke="#00B39F" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="184,43 179,31 189,31" fill="#00B39F"/>
  </g>

  <!-- Etiqueta Biomecánica Inferior -->
  <rect x="36" y="244" width="248" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.92" stroke="#00B39F" stroke-width="1.2"/>
  <text x="160" y="261" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B2B29" text-anchor="middle">
    Fricción Interdigital: Palmas con Dedos Entrelazados
  </text>
</svg>
