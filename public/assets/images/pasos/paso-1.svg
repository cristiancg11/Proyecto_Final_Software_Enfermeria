<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#0B2B29"/>
  <!-- Manos enfrentadas frotando palmas -->
  <g fill="#00B39F" opacity="0.9">
    <!-- Mano Izquierda -->
    <path d="M150,230 C150,210 160,160 165,140 C168,130 175,130 178,140 C182,155 185,180 185,210 Z"/>
    <path d="M165,140 C168,110 175,90 182,90 C188,90 192,110 190,140 Z"/>
    <path d="M178,140 C182,100 190,80 198,80 C205,80 208,100 205,140 Z"/>
    <path d="M190,145 C195,115 202,100 210,100 C216,100 218,115 215,150 Z"/>
    <path d="M140,190 C125,175 115,170 110,175 C105,180 112,195 125,205 C140,215 150,225 150,230 Z"/>
    <!-- Palma base -->
    <path d="M140,190 C155,170 215,170 220,210 C220,240 160,250 140,230 Z" fill="#CFFBF0" opacity="0.3"/>
  </g>
  <!-- Flechas curvas de fricción circular -->
  <path d="M140,120 A60,60 0 1,1 260,180" fill="none" stroke="#FF6A4D" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 6"/>
  <polygon points="265,190 270,170 250,175" fill="#FF6A4D"/>
  <text x="200" y="275" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#CFFBF0" text-anchor="middle">Fricción Circular Palma con Palma</text>
</svg>
