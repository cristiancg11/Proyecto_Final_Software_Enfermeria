<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#0B2B29"/>
  <!-- Mano sobre dorso con dedos entrelazados -->
  <g fill="#00B39F" opacity="0.85">
    <!-- Mano base dorso -->
    <path d="M150,220 C160,170 170,120 180,100 C186,100 188,120 185,150 L200,105 C205,105 208,120 205,155 L218,115 C223,115 225,130 220,165 Z"/>
    <!-- Mano superior cruzada -->
    <path d="M130,160 C150,160 230,140 250,180 C260,200 240,230 210,230 C170,230 140,210 130,160 Z" fill="#00B39F" opacity="0.5"/>
  </g>
  <!-- Flechas de desplazamiento arriba/abajo -->
  <line x1="260" y1="120" x2="260" y2="180" stroke="#FF6A4D" stroke-width="6" stroke-linecap="round"/>
  <polygon points="260,110 252,125 268,125" fill="#FF6A4D"/>
  <polygon points="260,190 252,175 268,175" fill="#FF6A4D"/>
  <text x="200" y="275" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#CFFBF0" text-anchor="middle">Palma sobre Dorso y Dedos Entrelazados</text>
</svg>
