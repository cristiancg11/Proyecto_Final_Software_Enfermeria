<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#0B2B29"/>
  <!-- Pulgar atrapado en rotación -->
  <g fill="#00B39F" opacity="0.9">
    <!-- Pulgar vertical -->
    <rect x="185" y="90" width="28" height="90" rx="14" fill="#CFFBF0"/>
    <!-- Mano envolvente -->
    <path d="M150,150 C150,130 240,130 240,165 C240,200 150,200 150,150 Z" fill="#00B39F" opacity="0.85"/>
  </g>
  <!-- Flecha circular alrededor del pulgar -->
  <path d="M165,115 A35,35 0 1,1 235,115" fill="none" stroke="#FF6A4D" stroke-width="6" stroke-linecap="round"/>
  <polygon points="242,120 235,105 225,118" fill="#FF6A4D"/>
  <text x="200" y="275" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#CFFBF0" text-anchor="middle">Rotación del Pulgar Atrapado en la Palma</text>
</svg>
