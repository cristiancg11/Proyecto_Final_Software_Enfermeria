<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8FCF7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF4EE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="handPalmBase" x1="60" y1="120" x2="260" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="handFingertipsTop" x1="120" y1="20" x2="200" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2B29" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="280" rx="24" fill="url(#bgGrad6)"/>

  <!-- Centro de la palma con espiral concéntrica de frotado -->
  <g class="concentric-spiral-target" opacity="0.65">
    <circle cx="160" cy="165" r="14" stroke="#00B39F" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="160" cy="165" r="28" stroke="#FF6A4D" stroke-width="1.8" stroke-dasharray="5 4"/>
    <circle cx="160" cy="165" r="42" stroke="#00B39F" stroke-width="1.2" stroke-dasharray="6 6"/>
  </g>

  <!-- Manos: Mano inferior con palma abierta en cuenco, mano superior con yemas/uñas agrupadas en punta presionando -->
  <g class="hands-nails-friction" filter="url(#shadow6)">
    
    <!-- Mano Inferior (Palma Izquierda Abierta en Cuenco Supinado) -->
    <g class="hand-palmar-cup">
      <!-- Muñeca y antebrazo inferior -->
      <path d="M125 240 C125 210, 115 190, 105 170" stroke="#0B2B29" stroke-width="3" stroke-linecap="round"/>
      <path d="M195 240 C195 210, 205 190, 215 170" stroke="#0B2B29" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Cuenco de la palma horizontal extendida -->
      <path d="M85 180 C80 155, 95 135, 120 135 C135 135, 145 142, 160 145 C175 142, 185 135, 200 135 C225 135, 240 155, 235 180 C230 210, 195 225, 160 225 C125 225, 90 210, 85 180 Z" 
            fill="url(#handPalmBase)" stroke="#0B2B29" stroke-width="3.5" stroke-linejoin="round"/>
      
      <!-- Pulgar de la mano inferior relajado hacia afuera -->
      <path d="M85 160 C70 162, 58 175, 62 188 C66 198, 80 198, 92 190" stroke="#0B2B29" stroke-width="3" fill="#FDBA74" stroke-linecap="round"/>
      
      <!-- Surcos y pliegues palmares concéntricos -->
      <path d="M110 175 C135 185, 185 185, 210 175" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
    </g>

    <!-- Mano Superior (Dedos Agrupados en Punta / Cúpula Descendiendo hacia la Palma) -->
    <g class="hand-fingertips-cluster">
      <!-- Antebrazo que baja desde arriba -->
      <path d="M142 20 L146 65" stroke="#008072" stroke-width="3" stroke-linecap="round"/>
      <path d="M178 20 L174 65" stroke="#008072" stroke-width="3" stroke-linecap="round"/>

      <!-- Dorso y articulaciones que convergen en cono hacia el centro -->
      <path d="M135 60 C130 80, 140 115, 148 152 L172 152 C180 115, 190 80, 185 60 Z" 
            fill="url(#handFingertipsTop)" stroke="#008072" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- Las 5 Yemas y Uñas Juntas en Cúpula Contactando el Centro de la Palma -->
      <!-- Dedo Pulgar agrupado -->
      <ellipse cx="148" cy="152" rx="4.5" ry="5.5" fill="#FFFFFF" stroke="#008072" stroke-width="2"/>
      <path d="M146 150 Q148 147 150 150" stroke="#FF6A4D" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Dedo Índice agrupado -->
      <ellipse cx="155" cy="148" rx="4.5" ry="5.5" fill="#FFFFFF" stroke="#008072" stroke-width="2"/>
      <path d="M153 146 Q155 143 157 146" stroke="#FF6A4D" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Dedo Medio agrupado (Centro) -->
      <ellipse cx="162" cy="154" rx="4.5" ry="5.5" fill="#FFFFFF" stroke="#008072" stroke-width="2"/>
      <path d="M160 152 Q162 149 164 152" stroke="#FF6A4D" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Dedo Anular agrupado -->
      <ellipse cx="169" cy="148" rx="4.5" ry="5.5" fill="#FFFFFF" stroke="#008072" stroke-width="2"/>
      <path d="M167 146 Q169 143 171 146" stroke="#FF6A4D" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Dedo Meñique agrupado -->
      <ellipse cx="174" cy="153" rx="4" ry="5" fill="#FFFFFF" stroke="#008072" stroke-width="2"/>
      <path d="M172 151 Q174 148 176 151" stroke="#FF6A4D" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Flechas Espirales Concéntricas en el Centro Palmar -->
  <g class="spiral-arrows">
    <!-- Flecha Circular Horaria en Coral -->
    <path d="M145 125 C162 118, 185 122, 192 138" stroke="#FF6A4D" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="194,144 196,131 184,136" fill="#FF6A4D"/>
    
    <!-- Flecha Circular Opuesta en Turquesa -->
    <path d="M175 195 C155 202, 132 195, 126 180" stroke="#00B39F" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="124,174 122,187 134,182" fill="#00B39F"/>
  </g>

  <!-- Etiqueta Biomecánica Inferior -->
  <rect x="36" y="244" width="248" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.92" stroke="#00B39F" stroke-width="1.2"/>
  <text x="160" y="261" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B2B29" text-anchor="middle">
    Fricción de Yemas y Uñas en Palma Opuesta (Espiral)
  </text>
</svg>
