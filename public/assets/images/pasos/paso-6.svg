<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#0B2B29"/>
  <!-- Yemas agrupadas frotando palma -->
  <g fill="#00B39F" opacity="0.9">
    <!-- Palma base plana -->
    <ellipse cx="200" cy="190" rx="60" ry="35" fill="#00B39F" opacity="0.4"/>
    <!-- Yemas puntas -->
    <circle cx="185" cy="175" r="9" fill="#CFFBF0"/>
    <circle cx="200" cy="165" r="9" fill="#CFFBF0"/>
    <circle cx="215" cy="175" r="9" fill="#CFFBF0"/>
    <circle cx="200" cy="185" r="9" fill="#CFFBF0"/>
  </g>
  <!-- Espiral de frotado de yemas -->
  <path d="M170,180 A25,25 0 1,1 225,185" fill="none" stroke="#FF6A4D" stroke-width="5" stroke-linecap="round"/>
  <polygon points="230,192 225,178 217,188" fill="#FF6A4D"/>
  <text x="200" y="275" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#CFFBF0" text-anchor="middle">Frotado Circular de Yemas y Uñas en la Palma</text>
</svg>
