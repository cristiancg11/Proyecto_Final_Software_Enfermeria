<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fondo circular suave turquesa / celeste estilo infografía clínica OMS -->
    <linearGradient id="bgGradPaso4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7F6"/>
      <stop offset="60%" stop-color="#CFFBF0"/>
      <stop offset="100%" stop-color="#B2F5EA"/>
    </linearGradient>

    <!-- Tonos de piel médica aséptica -->
    <linearGradient id="skinLeftPaso4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8D3"/>
      <stop offset="70%" stop-color="#F6CEAA"/>
      <stop offset="100%" stop-color="#EBB386"/>
    </linearGradient>
    <linearGradient id="skinRightPaso4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEEDC"/>
      <stop offset="70%" stop-color="#FCD6B6"/>
      <stop offset="100%" stop-color="#F0BA8E"/>
    </linearGradient>

    <!-- Espuma antiséptica -->
    <linearGradient id="foamGradPaso4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.75"/>
    </linearGradient>

    <filter id="softGlowPaso4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D9488" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Círculo Base Central Infografía OMS -->
  <circle cx="250" cy="250" r="225" fill="url(#bgGradPaso4)" stroke="#5EEAD4" stroke-width="6" filter="url(#softGlowPaso4)"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#99F6E4" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Grupo Dedos Trabados / Candado (Dorso de dedos contra palma opuesta) -->
  <g class="hands-group" transform="translate(0, 15)">
    <!-- Mano Izquierda (Sujeta los dedos en gancho con la palma orientada al frente) -->
    <g id="mano-bloqueo-izq">
      <!-- Muñeca izquierda -->
      <path d="M120,380 L180,290 C190,275 205,265 220,260" fill="url(#skinLeftPaso4)" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Palma izquierda que envuelve -->
      <path d="M180,290 C190,320 250,325 280,295 L275,255 C240,245 200,250 180,290 Z" fill="url(#skinLeftPaso4)" stroke="#B45309" stroke-width="2.5"/>
      <!-- Pulgar izquierdo apoyado en el dorso opuesto -->
      <path d="M185,265 C175,235 170,215 185,210 C198,205 208,225 215,255 Z" fill="url(#skinLeftPaso4)" stroke="#B45309" stroke-width="2.5"/>

      <!-- Nudillos y falanges dobladas en gancho mano izquierda -->
      <path d="M215,250 C215,210 230,195 245,195 C255,195 255,225 250,250" fill="url(#skinLeftPaso4)" stroke="#B45309" stroke-width="2.5"/>
      <path d="M235,245 C235,200 250,185 265,185 C275,185 275,220 270,245" fill="url(#skinLeftPaso4)" stroke="#B45309" stroke-width="2.5"/>
      <path d="M255,245 C255,205 270,190 285,190 C295,190 295,225 290,250" fill="url(#skinLeftPaso4)" stroke="#B45309" stroke-width="2.5"/>
      <path d="M275,250 C275,215 288,200 300,200 C310,200 310,230 305,255" fill="url(#skinLeftPaso4)" stroke="#B45309" stroke-width="2.5"/>
    </g>

    <!-- Mano Derecha (Dedos trabados en dirección opuesta formando el candado OMS) -->
    <g id="mano-bloqueo-der">
      <!-- Muñeca derecha -->
      <path d="M380,380 L320,290 C310,275 295,265 280,260" fill="url(#skinRightPaso4)" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Palma derecha -->
      <path d="M320,290 C310,320 250,325 220,295 L225,255 C260,245 300,250 320,290 Z" fill="url(#skinRightPaso4)" stroke="#B45309" stroke-width="2.5"/>
      <!-- Pulgar derecho apoyado en el dorso opuesto -->
      <path d="M315,265 C325,235 330,215 315,210 C302,205 292,225 285,255 Z" fill="url(#skinRightPaso4)" stroke="#B45309" stroke-width="2.5"/>

      <!-- Nudillos y falanges derechas enclavadas -->
      <path d="M230,230 C220,230 215,255 225,275 C235,280 245,260 240,230" fill="url(#skinRightPaso4)" stroke="#B45309" stroke-width="2.5"/>
      <path d="M250,230 C240,230 235,260 245,280 C255,285 265,265 260,230" fill="url(#skinRightPaso4)" stroke="#B45309" stroke-width="2.5"/>
      <path d="M270,230 C260,230 255,260 265,280 C275,285 285,265 280,230" fill="url(#skinRightPaso4)" stroke="#B45309" stroke-width="2.5"/>
      <path d="M290,235 C280,235 275,265 285,285 C295,285 305,270 300,235" fill="url(#skinRightPaso4)" stroke="#B45309" stroke-width="2.5"/>

      <!-- Pliegues de los nudillos -->
      <path d="M238,208 C244,208 248,212 250,216" stroke="#D97706" stroke-width="1.8" fill="none"/>
      <path d="M258,200 C264,200 268,204 270,208" stroke="#D97706" stroke-width="1.8" fill="none"/>
      <path d="M278,202 C284,202 288,206 290,210" stroke="#D97706" stroke-width="1.8" fill="none"/>
      <path d="M295,212 C300,212 303,215 305,218" stroke="#D97706" stroke-width="1.8" fill="none"/>
    </g>

    <!-- Espuma antiséptica concentrada en los nudillos trabados -->
    <g id="espuma-candado" fill="url(#foamGradPaso4)" stroke="#6EE7B7" stroke-width="2">
      <!-- Burbujas en el centro del candado -->
      <circle cx="230" cy="245" r="14"/>
      <circle cx="250" cy="250" r="18"/>
      <circle cx="270" cy="245" r="16"/>
      <circle cx="290" cy="250" r="13"/>
      <circle cx="260" cy="225" r="15"/>
      <circle cx="240" cy="275" r="14"/>
      <circle cx="265" cy="275" r="15"/>

      <!-- Burbujas flotantes laterales -->
      <circle cx="160" cy="240" r="10" stroke="#00B39F" stroke-width="2" fill="white" opacity="0.9"/>
      <circle cx="163" cy="237" r="3" fill="#00B39F" opacity="0.6"/>
      <circle cx="340" cy="240" r="11" stroke="#00B39F" stroke-width="2" fill="white" opacity="0.9"/>
      <circle cx="343" cy="237" r="3.5" fill="#00B39F" opacity="0.6"/>
      <circle cx="200" cy="180" r="8" stroke="#00B39F" stroke-width="1.8" fill="white" opacity="0.9"/>
      <circle cx="300" cy="170" r="9" stroke="#00B39F" stroke-width="1.8" fill="white" opacity="0.9"/>
      <circle cx="250" cy="320" r="11" stroke="#00B39F" stroke-width="2" fill="white" opacity="0.9"/>
    </g>

    <!-- Flechas Recíprocas Horizontales de Fricción Lateral -->
    <g id="flechas-candado">
      <!-- Flecha horizontal superior hacia la izquierda -->
      <path d="M310,155 L190,155" fill="none" stroke="#00A389" stroke-width="6" stroke-linecap="round"/>
      <polygon points="180,155 196,147 196,163" fill="#00A389"/>

      <!-- Flecha horizontal inferior hacia la derecha -->
      <path d="M190,325 L310,325" fill="none" stroke="#00A389" stroke-width="6" stroke-linecap="round"/>
      <polygon points="320,325 304,317 304,333" fill="#00A389"/>

      <!-- Destellos de limpieza -->
      <path d="M150,150 L155,140 L160,150 L170,155 L160,160 L155,170 L150,160 L140,155 Z" fill="#00B39F" opacity="0.85"/>
      <path d="M350,150 L355,140 L360,150 L370,155 L360,160 L355,170 L350,160 L340,155 Z" fill="#00B39F" opacity="0.85"/>
    </g>
  </g>

  <!-- Píldora Guía OMS Paso 4 -->
  <g transform="translate(130, 420)">
    <rect width="240" height="42" rx="21" fill="#008072" filter="url(#softGlowPaso4)"/>
    <circle cx="28" cy="21" r="13" fill="#FFFFFF"/>
    <text x="28" y="26" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#008072" text-anchor="middle">4</text>
    <text x="132" y="26" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DORSO DE DEDOS</text>
  </g>
</svg>
