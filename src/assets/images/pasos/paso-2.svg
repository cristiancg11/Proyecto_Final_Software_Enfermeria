<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8FCF7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF4EE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="dorsalSkin" x1="80" y1="50" x2="220" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="60%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="topPalmSkin" x1="120" y1="40" x2="240" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2B29" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="280" rx="24" fill="url(#bgGrad2)"/>

  <!-- Líneas guías longitudinales -->
  <line x1="85" y1="50" x2="85" y2="230" stroke="#00B39F" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.3"/>
  <line x1="235" y1="50" x2="235" y2="230" stroke="#FF6A4D" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.3"/>

  <!-- Grupo Manos: Mano inferior en dorso, mano superior en palma entrelazada -->
  <g class="hands-step2" filter="url(#shadow2)">
    <!-- Mano Inferior (Mano Izquierda - Vista Dorsal) -->
    <g class="hand-dorsum">
      <!-- Muñeca y antebrazo inferior -->
      <path d="M120 235 C120 205, 116 185, 120 160 C124 140, 130 130, 132 105" stroke="#0B2B29" stroke-width="3" stroke-linecap="round"/>
      <path d="M176 235 C176 205, 172 185, 176 160 C180 140, 184 130, 186 105" stroke="#0B2B29" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Dorso de la mano -->
      <path d="M120 225 C116 195, 118 165, 124 135 L120 75 C120 62, 132 62, 132 75 L135 125 L140 60 C140 48, 152 48, 152 60 L154 120 L160 65 C160 52, 172 52, 172 65 L170 125 L178 80 C178 70, 188 70, 188 82 L182 140 C186 165, 184 195, 176 225 Z" 
            fill="url(#dorsalSkin)" fill-opacity="0.9" stroke="#0B2B29" stroke-width="3.5" stroke-linejoin="round"/>
      
      <!-- Nudillos y tendones extensores visibles en el dorso -->
      <path d="M126 135 C128 145, 132 170, 136 190" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
      <path d="M142 130 C144 145, 146 170, 148 190" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
      <path d="M158 130 C158 145, 156 170, 154 190" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
      <path d="M172 135 C170 145, 166 170, 162 190" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

      <!-- Uñas del dorso -->
      <path d="M122 76 C124 72, 128 72, 130 76" stroke="#0B2B29" stroke-width="2"/>
      <path d="M142 62 C144 58, 148 58, 150 62" stroke="#0B2B29" stroke-width="2"/>
      <path d="M162 67 C164 63, 168 63, 170 67" stroke="#0B2B29" stroke-width="2"/>
      <path d="M180 82 C182 78, 186 78, 187 82" stroke="#0B2B29" stroke-width="2"/>
    </g>

    <!-- Mano Superior (Mano Derecha con Palma Cruzada y Dedos Entrelazados) -->
    <g class="hand-palmar-interlaced" transform="translate(18, -12) rotate(16, 160, 140)">
      <!-- Palma que cubre transversalmente el dorso -->
      <path d="M102 185 C95 155, 105 130, 120 110 C128 98, 142 90, 160 85 C185 85, 205 95, 220 120 C228 135, 225 160, 215 185 Z" 
            fill="url(#topPalmSkin)" fill-opacity="0.88" stroke="#008072" stroke-width="3.5" stroke-linejoin="round"/>
      
      <!-- Dedos superiores entrelazándose entre los dedos inferiores -->
      <!-- Dedo cruzado 1 -->
      <path d="M132 100 C130 70, 134 50, 136 35 C138 25, 148 26, 148 36 L144 95" stroke="#008072" stroke-width="3" stroke-linecap="round" fill="#FBBF24"/>
      <!-- Dedo cruzado 2 -->
      <path d="M152 92 C152 65, 156 42, 160 28 C162 18, 172 20, 172 30 L168 90" stroke="#008072" stroke-width="3" stroke-linecap="round" fill="#FBBF24"/>
      <!-- Dedo cruzado 3 -->
      <path d="M174 95 C176 72, 182 52, 186 42 C188 34, 198 35, 198 45 L190 98" stroke="#008072" stroke-width="3" stroke-linecap="round" fill="#FBBF24"/>
      <!-- Pulgar en oposición envolvente -->
      <path d="M108 140 C95 145, 82 142, 78 132 C74 122, 84 110, 100 115" stroke="#008072" stroke-width="3" stroke-linecap="round" fill="#FDE68A"/>
    </g>
  </g>

  <!-- Flechas de Deslizamiento Longitudinal Bidireccional -->
  <g class="arrows-longitudinal">
    <!-- Flecha hacia arriba en Turquesa -->
    <path d="M72 165 L72 105" stroke="#00B39F" stroke-width="4" stroke-linecap="round"/>
    <polygon points="72,96 66,108 78,108" fill="#00B39F"/>
    
    <!-- Flecha hacia abajo en Coral -->
    <path d="M248 105 L248 165" stroke="#FF6A4D" stroke-width="4" stroke-linecap="round"/>
    <polygon points="248,174 242,162 254,162" fill="#FF6A4D"/>
  </g>

  <!-- Etiqueta Biomecánica Inferior -->
  <rect x="36" y="244" width="248" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.92" stroke="#00B39F" stroke-width="1.2"/>
  <text x="160" y="261" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B2B29" text-anchor="middle">
    Fricción Longitudinal: Palma sobre Dorso
  </text>
</svg>
