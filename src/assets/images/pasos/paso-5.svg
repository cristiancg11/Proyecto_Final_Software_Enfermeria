<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8FCF7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF4EE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="handThumbLeft" x1="100" y1="50" x2="160" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="handFistRight" x1="140" y1="70" x2="250" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2B29" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="280" rx="24" fill="url(#bgGrad5)"/>

  <!-- Órbitas de rotación del pulgar de fondo -->
  <ellipse cx="140" cy="115" rx="55" ry="32" stroke="#FF6A4D" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.5" transform="rotate(-15, 140, 115)"/>

  <!-- Manos: Mano izquierda extendiendo el pulgar, mano derecha cerrándose en puño rotacional alrededor de él -->
  <g class="hands-thumb-wrap" filter="url(#shadow5)">
    
    <!-- Mano Izquierda (Base y Pulgar Erguido en Abducción) -->
    <g class="hand-thumb-base">
      <!-- Muñeca inferior izquierda -->
      <path d="M85 235 C90 195, 95 160, 105 135 L120 135 C115 165, 110 200, 115 235 Z" 
            fill="url(#handThumbLeft)" stroke="#0B2B29" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Palma izquierda relajada -->
      <path d="M100 155 C90 145, 75 140, 65 145 C55 150, 52 165, 60 178 L95 185" 
            fill="url(#handThumbLeft)" stroke="#0B2B29" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Pulgar erguido que asciende hacia el centro para ser atrapado -->
      <path d="M110 140 C116 115, 124 85, 132 58 C136 44, 150 44, 152 58 L148 115" 
            fill="url(#handThumbLeft)" stroke="#0B2B29" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Uña del pulgar -->
      <path d="M136 60 C138 52, 146 52, 148 60" stroke="#0B2B29" stroke-width="2.5" fill="#FFE4D6"/>
    </g>

    <!-- Mano Derecha (Puño Envolvente que Rodea el Pulgar en 360°) -->
    <g class="hand-fist-wrapper" transform="translate(10, 0)">
      <!-- Muñeca y antebrazo de la mano derecha -->
      <path d="M235 230 C220 200, 215 175, 205 155 L225 140 C235 165, 245 195, 255 230 Z" 
            fill="url(#handFistRight)" stroke="#008072" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Dedos del puño cilíndrico envolviendo el pulgar (Dedo índice, medio, anular, meñique) -->
      <!-- Dedo 1 (Superior) que abraza el pulgar -->
      <path d="M210 95 C190 85, 140 85, 126 100 C118 110, 125 125, 145 125 L195 120" 
            fill="url(#handFistRight)" stroke="#008072" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Dedo 2 que abraza el pulgar -->
      <path d="M205 115 C185 105, 140 105, 128 120 C120 130, 128 145, 148 145 L195 140" 
            fill="url(#handFistRight)" stroke="#008072" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Dedo 3 que abraza la base del pulgar -->
      <path d="M200 135 C180 128, 145 128, 135 142 C128 152, 136 165, 155 165 L195 158" 
            fill="url(#handFistRight)" stroke="#008072" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Dedo 4 envolvente inferior -->
      <path d="M195 155 C180 150, 152 150, 142 162 C136 172, 145 182, 165 182 L195 175" 
            fill="url(#handFistRight)" stroke="#008072" stroke-width="3.5" stroke-linecap="round"/>
      
      <!-- Pulgar de la mano derecha cerrando el puño por fuera -->
      <path d="M215 105 C228 115, 230 145, 215 165" stroke="#008072" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Flechas Envolventes de Rotación Completa 360° -->
  <g class="thumb-rotation-arrows">
    <!-- Flecha Circular Superior en Turquesa -->
    <path d="M102 75 C115 55, 165 52, 182 72" stroke="#00B39F" stroke-width="4" stroke-linecap="round"/>
    <polygon points="188,78 184,65 174,72" fill="#00B39F"/>
    
    <!-- Flecha Circular Inferior en Coral -->
    <path d="M182 175 C165 195, 115 192, 98 172" stroke="#FF6A4D" stroke-width="4" stroke-linecap="round"/>
    <polygon points="92,166 96,179 106,172" fill="#FF6A4D"/>
  </g>

  <!-- Etiqueta Biomecánica Inferior -->
  <rect x="36" y="244" width="248" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.92" stroke="#00B39F" stroke-width="1.2"/>
  <text x="160" y="261" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B2B29" text-anchor="middle">
    Fricción Rotacional del Pulgar Atrapado (360°)
  </text>
</svg>
