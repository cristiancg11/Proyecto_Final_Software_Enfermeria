<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8FCF7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF4EE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="handHookLeft" x1="60" y1="90" x2="160" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="handHookRight" x1="160" y1="90" x2="260" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2B29" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="280" rx="24" fill="url(#bgGrad4)"/>

  <!-- Candado de Manos Interconectadas (Frotado de Nudillos y Falanges Dorsales) -->
  <g class="hands-locked" filter="url(#shadow4)">
    
    <!-- Brazo y Muñeca Izquierda hacia la izquierda -->
    <path d="M45 110 C70 110, 95 115, 110 120 L110 170 C95 175, 70 180, 45 180 Z" 
          fill="url(#handHookLeft)" stroke="#0B2B29" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Brazo y Muñeca Derecha hacia la derecha -->
    <path d="M275 110 C250 110, 225 115, 210 120 L210 170 C225 175, 250 180, 275 180 Z" 
          fill="url(#handHookRight)" stroke="#008072" stroke-width="3" stroke-linejoin="round"/>

    <!-- Bloque Central de Falanges Flexionadas en Gancho (Candado) -->
    <!-- Falanges Mano Izquierda que enganchan hacia la derecha -->
    <g class="hook-fingers-left">
      <!-- Dedo 1 -->
      <path d="M110 100 C135 95, 165 95, 175 105 C185 115, 180 130, 165 130 L125 130" 
            fill="url(#handHookLeft)" stroke="#0B2B29" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Dedo 2 -->
      <path d="M110 120 C135 115, 170 115, 180 125 C190 135, 185 150, 170 150 L125 150" 
            fill="url(#handHookLeft)" stroke="#0B2B29" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Dedo 3 -->
      <path d="M110 140 C135 135, 170 135, 180 145 C190 155, 185 170, 170 170 L125 170" 
            fill="url(#handHookLeft)" stroke="#0B2B29" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Dedo 4 -->
      <path d="M110 160 C130 158, 160 158, 170 168 C180 178, 175 188, 160 188 L125 188" 
            fill="url(#handHookLeft)" stroke="#0B2B29" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Falanges Mano Derecha que enganchan hacia la izquierda en oposición -->
    <g class="hook-fingers-right">
      <!-- Gancho derecho entrelazado -->
      <path d="M210 105 C185 100, 155 100, 145 110 C135 120, 140 135, 155 135 L195 135" 
            fill="url(#handHookRight)" stroke="#008072" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M210 125 C185 120, 150 120, 140 130 C130 140, 135 155, 150 155 L195 155" 
            fill="url(#handHookRight)" stroke="#008072" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M210 145 C185 140, 150 140, 140 150 C130 160, 135 175, 150 175 L195 175" 
            fill="url(#handHookRight)" stroke="#008072" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M210 165 C190 162, 160 162, 150 172 C140 182, 145 192, 160 192 L195 192" 
            fill="url(#handHookRight)" stroke="#008072" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Resalte de los Nudillos y Articulaciones Interfalángicas -->
    <circle cx="178" cy="115" r="4" fill="#FFFFFF" stroke="#FF6A4D" stroke-width="1.5"/>
    <circle cx="182" cy="135" r="4" fill="#FFFFFF" stroke="#FF6A4D" stroke-width="1.5"/>
    <circle cx="182" cy="155" r="4" fill="#FFFFFF" stroke="#FF6A4D" stroke-width="1.5"/>
    <circle cx="172" cy="175" r="4" fill="#FFFFFF" stroke="#FF6A4D" stroke-width="1.5"/>

    <circle cx="142" cy="120" r="4" fill="#FFFFFF" stroke="#00B39F" stroke-width="1.5"/>
    <circle cx="138" cy="140" r="4" fill="#FFFFFF" stroke="#00B39F" stroke-width="1.5"/>
    <circle cx="138" cy="160" r="4" fill="#FFFFFF" stroke="#00B39F" stroke-width="1.5"/>
    <circle cx="148" cy="180" r="4" fill="#FFFFFF" stroke="#00B39F" stroke-width="1.5"/>
  </g>

  <!-- Flechas de Vaivén Lateral Recíproco -->
  <g class="hook-lateral-arrows">
    <!-- Flecha izquierda en Turquesa -->
    <path d="M110 65 L60 65" stroke="#00B39F" stroke-width="4" stroke-linecap="round"/>
    <polygon points="50,65 62,59 62,71" fill="#00B39F"/>
    
    <!-- Flecha derecha en Coral -->
    <path d="M210 65 L260 65" stroke="#FF6A4D" stroke-width="4" stroke-linecap="round"/>
    <polygon points="270,65 258,59 258,71" fill="#FF6A4D"/>
  </g>

  <!-- Etiqueta Biomecánica Inferior -->
  <rect x="36" y="244" width="248" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.92" stroke="#00B39F" stroke-width="1.2"/>
  <text x="160" y="261" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B2B29" text-anchor="middle">
    Dorso de los Dedos Trabados contra Palma Opuesta
  </text>
</svg>
